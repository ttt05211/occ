[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="causal-se2-occ"
version="0.1.0"
description="Standalone causal source-centred SE(2) occupancy forecasting implementation extracted from ttt05211/swfm"
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.24","scipy>=1.10","torch>=2.1","PyYAML>=6.0"]
[project.optional-dependencies]
nuscenes=["nuscenes-devkit>=1.1.11"]
viz=["matplotlib>=3.7"]
dev=["pytest>=8"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
