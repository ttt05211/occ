name: ci
on:
  push:
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -c "import causal_se2_occ; from causal_se2_occ.models.stwm import SourceCenteredSE2Predictor; assert sum(p.numel() for p in SourceCenteredSE2Predictor().parameters()) == 2073220"
      - run: pytest -q
